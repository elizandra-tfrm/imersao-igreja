<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel administrativo — Imersão Mulheres Renovadas para Transformar</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Lato:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20">
</head>
<body class="admin">

  <!-- ── Login ─────────────────────────────────────────────── -->
  <div class="vidro admin-login" id="tela-login">
    <h1>Painel administrativo</h1>
    <p class="sub">Imersão Mulheres Renovadas para Transformar</p>
    <form id="form-login">
      <div>
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" autocomplete="username" required>
      </div>
      <div>
        <label for="senha">Senha</label>
        <div class="campo-senha">
          <input type="password" id="senha" name="senha" autocomplete="current-password" required>
          <button type="button" class="botao-olho" id="botao-olho" aria-label="Mostrar senha" aria-pressed="false">
            <svg id="icone-olho-aberto" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg id="icone-olho-fechado" hidden width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.36 18.36 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a18.42 18.42 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="botao" id="botao-entrar">Entrar</button>
      <div class="admin-erro" id="erro-login" role="alert"></div>
    </form>
  </div>

  <!-- ── Painel ────────────────────────────────────────────── -->
  <div id="tela-painel" hidden>
    <div class="admin-cabecalho">
      <div>
        <h1>Inscrições</h1>
        <div class="contador" id="contador">Carregando...</div>
      </div>
      <div class="admin-acoes-topo">
        <input type="search" id="busca" placeholder="Buscar por nome, código, e-mail...">
        <select id="filtro-situacao" aria-label="Filtrar por situação">
          <option value="">Todas as situações</option>
        </select>
        <button type="button" class="botao-mini" id="botao-excel">Exportar Excel</button>
        <button type="button" class="botao-mini botao-mini--sair" id="botao-sair">Sair</button>
      </div>
    </div>

    <!-- Os três primeiros são botões: clicar filtra a tabela naquele grupo.
         "Arrecadado" é só leitura — não existe filtro "por dinheiro". -->
    <div class="admin-cards" id="admin-cards" hidden>
      <button type="button" class="card-metrica" data-card="todas" aria-pressed="false">
        <span class="card-rotulo">Inscrições</span>
        <strong class="card-numero" id="card-todas-numero">—</strong>
        <span class="card-nota"></span>
      </button>
      <button type="button" class="card-metrica card-metrica--pagas" data-card="pagas" aria-pressed="false">
        <span class="card-rotulo">Pagas</span>
        <strong class="card-numero" id="card-pagas-numero">—</strong>
        <span class="card-nota" id="card-pagas-nota"></span>
      </button>
      <button type="button" class="card-metrica card-metrica--aguardando" data-card="aguardando" aria-pressed="false">
        <span class="card-rotulo">Aguardando</span>
        <strong class="card-numero" id="card-aguardando-numero">—</strong>
        <span class="card-nota" id="card-aguardando-nota"></span>
      </button>
      <div class="card-metrica card-metrica--dinheiro">
        <span class="card-rotulo">Arrecadado</span>
        <strong class="card-numero" id="card-dinheiro-numero">—</strong>
        <span class="card-nota" id="card-dinheiro-nota"></span>
        <!-- Fixo no HTML: a ressalva vale sempre, não depende dos números. -->
        <span class="card-nota card-nota--obs">valor bruto, sem descontar taxas</span>
      </div>
    </div>
    <p class="admin-cards-extra" id="cards-extra" hidden></p>

    <div class="admin-tabela-wrap">
      <table class="admin-tabela">
        <thead>
          <tr>
            <th>Código</th>
            <th>Nome</th>
            <th>Situação</th>
            <th>Forma</th>
            <th>Data pgto.</th>
            <th>Origem</th>
            <th>Ficha</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
    </div>

    <div class="admin-rodape-tabela">
      <span class="rodape-aviso" id="aviso-alteracoes" hidden></span>
      <button type="button" class="botao-mini botao-salvar-tudo" id="botao-salvar-tudo" disabled>Salvar alterações</button>
    </div>
  </div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
(function () {
  var token = null;
  var todasInscricoes = [];

  /* Alterações feitas na tela e ainda não gravadas: código -> campos.
     Ficam aqui, e não só nos campos do HTML, porque a tabela é remontada a cada
     busca ou filtro — sem isso, digitar na busca apagaria o que a coordenação
     tivesse acabado de preencher nas outras linhas. */
  var pendentes = {};

  /* Filtro vindo dos cards ('pagas' / 'aguardando'). É um caminho alternativo ao
     <select> de situação: usar um limpa o outro, então o que está na tela sempre
     corresponde a exatamente um critério. */
  var filtroCard = '';

  var telaLogin = document.getElementById('tela-login');
  var telaPainel = document.getElementById('tela-painel');
  var formLogin = document.getElementById('form-login');
  var botaoEntrar = document.getElementById('botao-entrar');
  var erroLogin = document.getElementById('erro-login');
  var corpoTabela = document.getElementById('corpo-tabela');
  var campoBusca = document.getElementById('busca');
  var filtroSituacao = document.getElementById('filtro-situacao');
  var botaoSair = document.getElementById('botao-sair');
  var botaoExcel = document.getElementById('botao-excel');
  var contador = document.getElementById('contador');
  var cards = document.getElementById('admin-cards');
  var cardsExtra = document.getElementById('cards-extra');
  var cardTodasNumero = document.getElementById('card-todas-numero');
  var cardPagasNumero = document.getElementById('card-pagas-numero');
  var cardPagasNota = document.getElementById('card-pagas-nota');
  var cardAguardandoNumero = document.getElementById('card-aguardando-numero');
  var cardAguardandoNota = document.getElementById('card-aguardando-nota');
  var cardDinheiroNumero = document.getElementById('card-dinheiro-numero');
  var cardDinheiroNota = document.getElementById('card-dinheiro-nota');
  var botaoSalvarTudo = document.getElementById('botao-salvar-tudo');
  var avisoAlteracoes = document.getElementById('aviso-alteracoes');
  var botaoOlho = document.getElementById('botao-olho');
  var campoSenha = document.getElementById('senha');
  var iconeOlhoAberto = document.getElementById('icone-olho-aberto');
  var iconeOlhoFechado = document.getElementById('icone-olho-fechado');

  /* Colunas de texto simples da tabela. As demais (situação, forma, data) são
     campos editáveis, montados um a um em renderizarTabela. O dado completo
     continua disponível pelo Excel e pelo PDF da ficha. */
  var COLUNAS_TEXTO = ['codigo', 'nome'];
  var TOTAL_COLUNAS = 7; // as 2 de texto + situação, forma, data, origem, ficha

  /* Campos usados na busca — bem mais amplos que as colunas exibidas, pra ainda
     dar pra achar alguém pelo telefone, e-mail, CPF, igreja, respostas, etc. */
  var CAMPOS_BUSCA = [
    'codigo', 'nome', 'apelido', 'email', 'cpf', 'telefone', 'idade', 'estadoCivil',
    'status', 'formaPagamento', 'dataInscricao', 'dataPagamento',
    'temFilhos', 'quantosFilhos', 'participaIgreja', 'qualIgreja',
    'vidaComDeus', 'areaCura', 'motivacao', 'expectativa', 'necessidadeApoio'
  ];

  /* Situações que a coordenação pode escolher. Falhou/Expirado/Falha_Checkout
     ficam de fora: são resposta da PagBank, não decisão administrativa. */
  var STATUS_MANUAIS = ['Pendente', 'Pago', 'Isento', 'Desistiu', 'Cancelado'];

  var FORMAS_MANUAIS = [
    '', 'Pix', 'Cartão de crédito', 'Dinheiro', 'Transferência',
    'Empresa (faturado)', 'Cortesia', 'Outro'
  ];

  /* Rótulos amigáveis para o que a PagBank grava em Forma_Pagamento. */
  var NOME_FORMA_AUTOMATICA = { PIX: 'Pix', CREDIT_CARD: 'Cartão de crédito', BOLETO: 'Boleto' };

  /* Situações de quem não deve mais nada — não entram em "aguardando" nem somam
     no valor previsto. Todo o resto (Pendente, e também Falhou/Expirado/
     Falha_Checkout, que são tentativas que não se concluíram) ainda deve. */
  var STATUS_SEM_COBRANCA = ['Isento', 'Desistiu', 'Cancelado'];

  var ROTULO_SEM_COBRANCA = {
    Isento: ['isenta', 'isentas'],
    Desistiu: ['desistiu', 'desistiram'],
    Cancelado: ['cancelada', 'canceladas']
  };

  function grupoDaSituacao(status) {
    if (status === 'Pago') return 'pagas';
    if (STATUS_SEM_COBRANCA.indexOf(status) !== -1) return 'outras';
    return 'aguardando';
  }

  function formatarReais(centavos) {
    return (Number(centavos || 0) / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function tokenSalvo() {
    try { return sessionStorage.getItem('adminToken'); } catch (e) { return null; }
  }
  function salvarToken(t) {
    try { sessionStorage.setItem('adminToken', t); } catch (e) { /* navegador sem sessionStorage — sessão só dura nesta execução */ }
  }
  function limparToken() {
    try { sessionStorage.removeItem('adminToken'); } catch (e) {}
  }

  function mostrarLogin(mensagem) {
    token = null;
    limparToken();
    telaPainel.hidden = true;
    telaLogin.hidden = false;
    erroLogin.textContent = mensagem || '';
  }

  function mostrarPainel() {
    telaLogin.hidden = true;
    telaPainel.hidden = false;
    carregarInscricoes();
  }

  /** GET autenticado: junta o token e trata sessão expirada de forma central. */
  function apiGetAdmin(action, extra) {
    var params = Object.assign({ token: token }, extra || {});
    return apiGet(action, params).then(function (resp) {
      if (resp && resp.sessaoInvalida) {
        mostrarLogin('Sessão expirada. Faça login novamente.');
        return Promise.reject(new Error('sessao_invalida'));
      }
      return resp;
    });
  }

  function base64ParaBlob(base64, mime) {
    var bytes = atob(base64);
    var numeros = new Uint8Array(bytes.length);
    for (var i = 0; i < bytes.length; i++) numeros[i] = bytes.charCodeAt(i);
    return new Blob([numeros], { type: mime });
  }

  function baixarArquivo(base64, nomeArquivo, mime) {
    var url = URL.createObjectURL(base64ParaBlob(base64, mime));
    var link = document.createElement('a');
    link.href = url;
    link.download = nomeArquivo;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  }

  botaoOlho.addEventListener('click', function () {
    var vaiMostrar = campoSenha.type === 'password';
    campoSenha.type = vaiMostrar ? 'text' : 'password';
    iconeOlhoAberto.hidden = vaiMostrar;
    iconeOlhoFechado.hidden = !vaiMostrar;
    botaoOlho.setAttribute('aria-label', vaiMostrar ? 'Esconder senha' : 'Mostrar senha');
    botaoOlho.setAttribute('aria-pressed', vaiMostrar ? 'true' : 'false');
  });

  formLogin.addEventListener('submit', function (evento) {
    evento.preventDefault();
    erroLogin.textContent = '';
    botaoEntrar.disabled = true;
    botaoEntrar.textContent = 'Entrando...';

    var usuario = document.getElementById('usuario').value;
    var senha = document.getElementById('senha').value;

    apiPost('adminLogin', { usuario: usuario, senha: senha })
      .then(function (resp) {
        botaoEntrar.disabled = false;
        botaoEntrar.textContent = 'Entrar';
        if (!resp.ok) {
          erroLogin.textContent = resp.mensagem || 'Não foi possível entrar.';
          return;
        }
        token = resp.token;
        salvarToken(token);
        document.getElementById('senha').value = '';
        mostrarPainel();
      })
      .catch(function () {
        botaoEntrar.disabled = false;
        botaoEntrar.textContent = 'Entrar';
        erroLogin.textContent = 'Não conseguimos falar com o servidor. Tente novamente.';
      });
  });

  botaoSair.addEventListener('click', function () { mostrarLogin(); });

  botaoExcel.addEventListener('click', function () {
    var textoOriginal = botaoExcel.textContent;
    botaoExcel.disabled = true;
    botaoExcel.textContent = 'Gerando...';
    apiGetAdmin('adminExportarExcel')
      .then(function (resp) {
        botaoExcel.disabled = false;
        botaoExcel.textContent = textoOriginal;
        if (!resp.ok) { alert(resp.mensagem || 'Não foi possível exportar.'); return; }
        baixarArquivo(resp.base64, resp.nomeArquivo, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      })
      .catch(function () {
        botaoExcel.disabled = false;
        botaoExcel.textContent = textoOriginal;
      });
  });

  function carregarInscricoes() {
    mostrarLinhaUnica('Carregando inscrições...');
    apiGetAdmin('adminListarInscricoes')
      .then(function (resp) {
        if (!resp.ok) {
          mostrarLinhaUnica(resp.mensagem || 'Não foi possível carregar as inscrições.');
          return;
        }
        todasInscricoes = resp.inscricoes || [];
        pendentes = {};
        atualizarBotaoSalvar();
        preencherFiltroSituacao();
        atualizarCards();
        aplicarFiltros();
      })
      .catch(function (erro) {
        // Sessão expirada já foi tratada em apiGetAdmin (voltou para o login).
        // Qualquer outra falha precisa aparecer: um catch vazio aqui deixava a
        // tela em "Carregando inscrições..." para sempre, sem dizer o motivo.
        if (erro && erro.message === 'sessao_invalida') return;
        contador.textContent = '';
        mostrarLinhaUnica('Não foi possível carregar: ' + ((erro && erro.message) || 'erro desconhecido') + '. Tente recarregar a página.');
      });
  }

  function mostrarLinhaUnica(texto) {
    corpoTabela.textContent = '';
    var tr = document.createElement('tr');
    var td = document.createElement('td');
    td.colSpan = TOTAL_COLUNAS;
    td.textContent = texto;
    tr.appendChild(td);
    corpoTabela.appendChild(tr);
  }

  /**
   * Monta a tabela inteira via DOM (createElement/textContent), nunca
   * innerHTML: qualquer campo aqui vem do formulário público, que não exige
   * login pra ninguém escrever na planilha — então pode conter texto
   * malicioso. textContent nunca interpreta isso como HTML/script.
   */
  function renderizarTabela(lista) {
    corpoTabela.textContent = '';

    if (!lista.length) {
      mostrarLinhaUnica('Nenhuma inscrição encontrada.');
      return;
    }

    lista.forEach(function (item) {
      var tr = document.createElement('tr');

      COLUNAS_TEXTO.forEach(function (chave) {
        var td = document.createElement('td');
        td.textContent = item[chave] || '—';
        td.title = item[chave] || '';
        tr.appendChild(td);
      });

      /* Se esta linha tem alteração pendente, os campos voltam com o que foi
         digitado, não com o que veio do servidor — a tabela é remontada a cada
         busca/filtro e o trabalho não pode se perder no caminho. */
      var pendente = pendentes[item.codigo];

      var selectStatus = criarSelect(STATUS_MANUAIS, pendente ? pendente.Status : item.status);
      var selectForma = criarSelect(FORMAS_MANUAIS, pendente ? pendente.Forma_Pagamento : item.formaPagamento, function (v) {
        return NOME_FORMA_AUTOMATICA[v] || (v === '' ? '—' : v);
      });

      var inputData = document.createElement('input');
      inputData.type = 'date';
      inputData.value = (pendente ? pendente.Data_Pagamento : item.dataPagamento) || '';

      // Ao marcar "Pago", já sugere a data de hoje se ainda não houver nenhuma.
      // Registrado antes do rastreamento abaixo, para que a data já sugerida
      // entre na alteração pendente junto com a situação.
      selectStatus.addEventListener('change', function () {
        if (selectStatus.value === 'Pago' && !inputData.value) {
          inputData.value = new Date().toISOString().slice(0, 10);
        }
      });

      [selectStatus, selectForma, inputData].forEach(function (campo) {
        campo.addEventListener('change', function () {
          registrarAlteracao(item, tr, selectStatus, selectForma, inputData);
        });
      });

      if (pendente) tr.classList.add('linha-alterada');

      var editaveis = [selectStatus, selectForma, inputData];

      /* Pagamento confirmado pela PagBank não se mexe por aqui. O servidor
         também recusa a alteração — desabilitar na tela é só pra deixar claro
         o motivo, não é o que garante a trava. */
      if (item.travado) {
        editaveis.forEach(function (el) {
          el.disabled = true;
          el.title = 'Pagamento confirmado pela PagBank — não pode ser alterado por aqui.';
        });
      }

      // Situação, forma e data ficam lado a lado; a origem vem logo depois,
      // porque é ela que explica por que uma linha está travada.
      [selectStatus, selectForma, inputData].forEach(function (el) {
        var td = document.createElement('td');
        td.appendChild(el);
        tr.appendChild(td);
      });

      var tdOrigem = document.createElement('td');
      tdOrigem.textContent = item.origem || '—';
      if (item.origem === 'PagBank') {
        tdOrigem.title = 'Pagamento confirmado pela PagBank.';
      } else if (item.origem === 'Manual') {
        tdOrigem.title = 'Situação definida pela coordenação, sem passar pela PagBank.';
      }
      tr.appendChild(tdOrigem);

      var tdFicha = document.createElement('td');
      var botaoPdf = document.createElement('button');
      botaoPdf.type = 'button';
      botaoPdf.className = 'botao-pdf';
      botaoPdf.textContent = 'PDF';
      botaoPdf.addEventListener('click', function () { baixarFichaPdf(item.codigo, botaoPdf); });
      tdFicha.appendChild(botaoPdf);
      tr.appendChild(tdFicha);

      corpoTabela.appendChild(tr);
    });
  }

  /**
   * Monta um <select>. Se o valor atual da linha não estiver entre as opções
   * (ex: um status automático como "Falha_Checkout", ou "PIX" gravado pela
   * PagBank), ele entra como opção extra já selecionada — senão o navegador
   * mostraria a primeira opção como escolhida e um clique distraído em "Salvar"
   * trocaria o valor sem ninguém perceber.
   */
  function criarSelect(opcoes, valorAtual, rotuloDe) {
    var select = document.createElement('select');
    var valor = (valorAtual === null || valorAtual === undefined) ? '' : String(valorAtual);
    var lista = opcoes.slice();
    if (lista.indexOf(valor) === -1) lista.push(valor);

    lista.forEach(function (opcao) {
      var option = document.createElement('option');
      option.value = opcao;
      option.textContent = rotuloDe ? rotuloDe(opcao) : (opcao === '' ? '—' : opcao);
      if (opcao === valor) option.selected = true;
      select.appendChild(option);
    });
    return select;
  }

  /**
   * Compara os campos da linha com o que veio do servidor. Igual de novo (a
   * pessoa desfez a mudança na mão) tira a linha da lista de pendentes, para o
   * contador do botão nunca prometer mais do que há de fato para gravar.
   */
  function registrarAlteracao(item, tr, selectStatus, selectForma, inputData) {
    var mudou = selectStatus.value !== (item.status || '')
      || selectForma.value !== (item.formaPagamento || '')
      || inputData.value !== (item.dataPagamento || '');

    if (mudou) {
      pendentes[item.codigo] = {
        Status: selectStatus.value,
        Forma_Pagamento: selectForma.value,
        Data_Pagamento: inputData.value
      };
    } else {
      delete pendentes[item.codigo];
    }

    tr.classList.toggle('linha-alterada', mudou);
    atualizarBotaoSalvar();
  }

  function atualizarBotaoSalvar() {
    var quantas = Object.keys(pendentes).length;

    botaoSalvarTudo.disabled = quantas === 0;
    botaoSalvarTudo.textContent = quantas === 0
      ? 'Salvar alterações'
      : 'Salvar ' + quantas + (quantas === 1 ? ' alteração' : ' alterações');

    avisoAlteracoes.hidden = quantas === 0;
    avisoAlteracoes.textContent = quantas === 1
      ? '1 linha alterada e ainda não salva.'
      : quantas + ' linhas alteradas e ainda não salvas.';
  }

  /**
   * Grava todas as alterações pendentes numa requisição só. Uma chamada de Apps
   * Script por linha levaria dezenas de segundos para as dez ou vinte
   * confirmações de Pix que a coordenação faz de uma sentada.
   */
  function salvarTudo() {
    var codigos = Object.keys(pendentes);
    if (!codigos.length) return;

    var alteracoes = codigos.map(function (codigo) {
      return { codigo: codigo, campos: pendentes[codigo] };
    });

    botaoSalvarTudo.disabled = true;
    botaoSalvarTudo.textContent = 'Salvando...';

    apiPost('adminAtualizarInscricoes', { token: token, alteracoes: alteracoes })
      .then(function (resp) {
        if (resp && resp.sessaoInvalida) {
          mostrarLogin('Sessão expirada. Faça login novamente.');
          return;
        }
        if (!resp.ok) {
          atualizarBotaoSalvar();
          alert(resp.mensagem || 'Não foi possível salvar.');
          return;
        }

        /* Só saem de `pendentes` as linhas que o servidor confirmou ter gravado.
           As que falharam continuam marcadas na tela — passar a impressão de que
           foram salvas seria pior do que o erro em si. */
        var porCodigo = {};
        todasInscricoes.forEach(function (i) { porCodigo[i.codigo] = i; });

        (resp.codigosSalvos || []).forEach(function (codigo) {
          var item = porCodigo[codigo];
          var campos = pendentes[codigo];
          if (item && campos) {
            item.status = campos.Status;
            item.formaPagamento = campos.Forma_Pagamento;
            item.dataPagamento = campos.Data_Pagamento;
            item.origem = item.status && item.status !== 'Pendente' ? 'Manual' : '—';
          }
          delete pendentes[codigo];
        });

        preencherFiltroSituacao();
        atualizarCards();
        aplicarFiltros();
        atualizarBotaoSalvar();

        if (resp.erros && resp.erros.length) {
          alert('Salvei ' + (resp.salvos || 0) + '. Estas não deram certo:\n\n'
            + resp.erros.map(function (e) { return '• ' + e.codigo + ': ' + e.mensagem; }).join('\n'));
        } else {
          botaoSalvarTudo.textContent = 'Salvo!';
          setTimeout(atualizarBotaoSalvar, 2000);
        }
      })
      .catch(function () {
        atualizarBotaoSalvar();
        alert('Não conseguimos falar com o servidor. Suas alterações continuam na tela — é só tentar salvar de novo.');
      });
  }

  botaoSalvarTudo.addEventListener('click', salvarTudo);

  // Fechar a aba com alteração pendente perderia o trabalho sem aviso nenhum.
  window.addEventListener('beforeunload', function (evento) {
    if (!Object.keys(pendentes).length) return;
    evento.preventDefault();
    evento.returnValue = '';
  });

  /**
   * Cards do topo. "Aguardando" reúne tudo que ainda deve — Pendente e também
   * Falhou/Expirado/Falha_Checkout, que são tentativas não concluídas. O valor
   * é somado linha a linha porque o preço da inscrição mudou ao longo do tempo.
   */
  function atualizarCards() {
    var contas = { pagas: 0, aguardando: 0, outras: 0 };
    var centavos = { pagas: 0, aguardando: 0 };
    var semCobranca = {};

    todasInscricoes.forEach(function (item) {
      var grupo = grupoDaSituacao(item.status);
      contas[grupo]++;

      if (grupo === 'outras') {
        var situacao = item.status || '—';
        semCobranca[situacao] = (semCobranca[situacao] || 0) + 1;
      } else {
        centavos[grupo] += Number(item.valorCentavos) || 0;
      }
    });

    var total = todasInscricoes.length;

    cardTodasNumero.textContent = total;

    cardPagasNumero.textContent = contas.pagas;
    cardPagasNota.textContent = total ? Math.round((contas.pagas / total) * 100) + '% do total' : '';

    cardAguardandoNumero.textContent = contas.aguardando;
    cardAguardandoNota.textContent = centavos.aguardando
      ? formatarReais(centavos.aguardando) + ' a receber'
      : '';

    cardDinheiroNumero.textContent = formatarReais(centavos.pagas);
    cardDinheiroNota.textContent = 'de ' + formatarReais(centavos.pagas + centavos.aguardando) + ' previstos';

    // Só aparece quando existe alguma — na maior parte do tempo fica invisível.
    var trechos = Object.keys(semCobranca).map(function (situacao) {
      var quantas = semCobranca[situacao];
      var rotulo = ROTULO_SEM_COBRANCA[situacao];
      return quantas + ' ' + (rotulo ? rotulo[quantas === 1 ? 0 : 1] : situacao.toLowerCase());
    });
    cardsExtra.textContent = trechos.length ? 'Sem cobrança: ' + trechos.join(' · ') + '.' : '';
    cardsExtra.hidden = !trechos.length;

    cards.hidden = false;
  }

  function marcarCardAtivo() {
    var botoes = cards.querySelectorAll('.card-metrica[data-card]');
    Array.prototype.forEach.call(botoes, function (botao) {
      var ativo = botao.getAttribute('data-card') === filtroCard;
      botao.classList.toggle('card-metrica--ativo', ativo);
      botao.setAttribute('aria-pressed', ativo ? 'true' : 'false');
    });
  }

  cards.addEventListener('click', function (evento) {
    var botao = evento.target.closest('.card-metrica[data-card]');
    if (!botao) return;

    var alvo = botao.getAttribute('data-card');
    // "Inscrições" sempre volta pra lista inteira; clicar no card já ativo desliga.
    filtroCard = (alvo === 'todas' || alvo === filtroCard) ? '' : alvo;

    filtroSituacao.value = '';
    marcarCardAtivo();
    aplicarFiltros();
  });

  function baixarFichaPdf(codigo, botao) {
    var textoOriginal = botao.textContent;
    botao.disabled = true;
    botao.textContent = '...';
    apiGetAdmin('adminGerarFichaPdf', { codigo: codigo })
      .then(function (resp) {
        botao.disabled = false;
        botao.textContent = textoOriginal;
        if (!resp.ok) { alert(resp.mensagem || 'Não foi possível gerar a ficha.'); return; }
        baixarArquivo(resp.base64, resp.nomeArquivo, 'application/pdf');
      })
      .catch(function () {
        botao.disabled = false;
        botao.textContent = textoOriginal;
      });
  }

  /**
   * Monta a lista do filtro a partir das situações que realmente aparecem nas
   * inscrições — assim ele nunca oferece uma opção que não filtraria nada, e
   * cobre também as situações automáticas da PagBank quando elas existirem.
   */
  function preencherFiltroSituacao() {
    var escolhaAtual = filtroSituacao.value;
    var situacoes = [];
    todasInscricoes.forEach(function (item) {
      if (item.status && situacoes.indexOf(item.status) === -1) situacoes.push(item.status);
    });
    situacoes.sort();

    filtroSituacao.textContent = '';
    var todas = document.createElement('option');
    todas.value = '';
    todas.textContent = 'Todas as situações';
    filtroSituacao.appendChild(todas);

    situacoes.forEach(function (s) {
      var option = document.createElement('option');
      option.value = s;
      option.textContent = s;
      if (s === escolhaAtual) option.selected = true;
      filtroSituacao.appendChild(option);
    });
  }

  /** Busca por texto e filtro de situação valem ao mesmo tempo. */
  function aplicarFiltros() {
    var termo = campoBusca.value.trim().toLowerCase();
    var situacao = filtroSituacao.value;

    var filtradas = todasInscricoes.filter(function (item) {
      if (situacao && item.status !== situacao) return false;
      if (filtroCard && grupoDaSituacao(item.status) !== filtroCard) return false;
      if (!termo) return true;
      return CAMPOS_BUSCA.some(function (chave) {
        var valor = item[chave];
        return valor && String(valor).toLowerCase().indexOf(termo) !== -1;
      });
    });

    contador.textContent = filtradas.length === todasInscricoes.length
      ? todasInscricoes.length + ' inscrição(ões)'
      : filtradas.length + ' de ' + todasInscricoes.length + ' inscrição(ões)';

    renderizarTabela(filtradas);
  }

  campoBusca.addEventListener('input', aplicarFiltros);

  // O <select> e os cards são dois caminhos para a mesma coisa: usar um desliga
  // o outro, senão os dois somados poderiam esconder linhas sem explicação.
  filtroSituacao.addEventListener('change', function () {
    filtroCard = '';
    marcarCardAtivo();
    aplicarFiltros();
  });

  // Retoma a sessão se esta mesma aba já tinha um token válido guardado.
  token = tokenSalvo();
  if (token) mostrarPainel();
})();
</script>
</body>
</html>
