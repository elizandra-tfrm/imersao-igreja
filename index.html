<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscrição</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="cartao">
    <h1 id="titulo-evento">Inscrição</h1>
    <p class="subtitulo">Preencha seus dados para se inscrever.</p>
    <div class="valor-destaque" id="valor-destaque">Carregando...</div>

    <form id="form-inscricao" novalidate>
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" name="nome" autocomplete="name" required>
      <div class="erro-campo" id="erro-nome"></div>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
      <div class="erro-campo" id="erro-email"></div>

      <label for="cpf">CPF</label>
      <input type="text" id="cpf" name="cpf" inputmode="numeric" placeholder="Somente números" required>
      <div class="erro-campo" id="erro-cpf"></div>

      <label for="telefone">Telefone (com DDD)</label>
      <input type="text" id="telefone" name="telefone" inputmode="numeric" placeholder="Ex: 11988887777" required>
      <div class="erro-campo" id="erro-telefone"></div>

      <button type="submit" id="botao-enviar">Ir para pagamento</button>
      <div class="mensagem-geral" id="mensagem-geral"></div>
    </form>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    apiGet('config').then(function (resp) {
      if (resp && resp.ok) {
        document.getElementById('titulo-evento').textContent = resp.nomeEvento;
        document.title = 'Inscrição - ' + resp.nomeEvento;
        document.getElementById('valor-destaque').textContent = 'Valor da inscrição: ' + resp.valorFormatado;
      } else {
        document.getElementById('valor-destaque').remove();
      }
    }).catch(function () {
      document.getElementById('valor-destaque').remove();
    });

    var form = document.getElementById('form-inscricao');
    var botao = document.getElementById('botao-enviar');
    var mensagemGeral = document.getElementById('mensagem-geral');

    function limparErros() {
      ['nome', 'email', 'cpf', 'telefone'].forEach(function (campo) {
        document.getElementById('erro-' + campo).textContent = '';
      });
      mensagemGeral.textContent = '';
      mensagemGeral.className = 'mensagem-geral';
    }

    function habilitarBotao() {
      botao.disabled = false;
      botao.textContent = 'Ir para pagamento';
    }

    form.addEventListener('submit', function (evento) {
      evento.preventDefault();
      limparErros();
      botao.disabled = true;
      botao.textContent = 'Processando...';

      var dados = {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        cpf: document.getElementById('cpf').value,
        telefone: document.getElementById('telefone').value
      };

      apiPost('registrarInscricao', { dados: dados })
        .then(aoReceberResposta)
        .catch(aoFalhar);
    });

    function aoReceberResposta(resposta) {
      if (resposta.ok) {
        mensagemGeral.textContent = 'Tudo certo! Redirecionando para o pagamento...';
        mensagemGeral.className = 'mensagem-geral sucesso';
        window.location.href = resposta.paymentUrl;
        return;
      }

      if (resposta.campo) {
        var elErro = document.getElementById('erro-' + resposta.campo);
        if (elErro) elErro.textContent = resposta.mensagem;
      } else {
        mensagemGeral.textContent = resposta.mensagem || 'Não foi possível continuar. Tente novamente.';
        mensagemGeral.className = 'mensagem-geral erro';
      }
      habilitarBotao();
    }

    function aoFalhar() {
      mensagemGeral.textContent = 'Erro inesperado. Tente novamente em instantes.';
      mensagemGeral.className = 'mensagem-geral erro';
      habilitarBotao();
    }
  </script>
</body>
</html>
